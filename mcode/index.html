<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>mcode</title>
  <meta name="description" content="Write C++ in the browser and run it with gcc. Works on phones and installs as an app." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#14181e" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="mcode" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div id="menu-backdrop" class="menu-backdrop hidden"></div>

  <header class="topbar">
    <div class="file-wrap">
      <button id="btn-file" class="btn btn-icon" type="button" aria-label="File menu" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <div id="file-menu" class="menu hidden" role="menu">
        <button type="button" role="menuitem" data-act="new">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-8z"/><path d="M9 1.5v4h4M8 8v4M6 10h4"/></svg>
          New file
        </button>
        <button type="button" role="menuitem" data-act="open">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>
          Open…
        </button>
        <button type="button" role="menuitem" data-act="save">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 11v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
          Save…
        </button>
      </div>
    </div>
    <button id="filename" class="filename" type="button" title="Rename">main.cpp</button>
    <div class="spacer"></div>
    <select id="std" class="std-select" aria-label="C++ standard">
      <option value="c++17">C++17</option>
      <option value="c++2a" selected>C++20</option>
      <option value="c++2b">C++23</option>
    </select>
    <button id="btn-run" class="btn btn-run" type="button" title="Run (Ctrl+Enter)">
      <svg class="icon icon-run" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z"/></svg>
      <svg class="icon icon-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>
      <span class="run-label">Run</span>
    </button>
    <input id="file-input" type="file" accept=".cpp,.cc,.cxx,.c,.h,.hpp,.hh,.txt,text/plain" hidden />
  </header>

  <main class="workspace">
    <section class="editor-pane">
      <div id="editor" class="editor"></div>
    </section>

    <section class="terminal-pane">
      <div class="term-head">
        <span class="status-dot" id="status-dot"></span>
        <span class="term-status" id="term-status" role="status">Ready</span>
        <div class="spacer"></div>
        <span class="term-env" id="term-env">gcc 13.2, C++20</span>
        <button id="btn-clear" class="btn btn-ghost btn-sm" type="button">Clear</button>
      </div>
      <pre id="output" class="term-out"></pre>
      <div class="stdin-row">
        <label class="stdin-label" for="stdin">stdin</label>
        <textarea id="stdin" class="stdin-input" rows="1" placeholder="Input for std::cin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
